[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "{{ cookiecutter.repository_name }}"
version = "0.1.0"
description = "{{ cookiecutter.description }}"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "{{ cookiecutter.license }}" }
authors = [{ name = "{{ cookiecutter.author_name }}" }]
dependencies = [
{% if cookiecutter.profile == "python-api" -%}
  "fastapi==0.116.1",
  "pydantic-settings==2.10.1",
  "uvicorn==0.35.0",
{% endif -%}
]

[project.scripts]
{{ cookiecutter.repository_name }} = "{{ cookiecutter.package_name }}.cli:main"

[dependency-groups]
dev = [
{% if cookiecutter.profile == "python-api" -%}
  "httpx==0.28.1",
{% endif -%}
  "mypy==1.17.1",
  "pytest==8.4.2",
  "ruff==0.12.12",
]

[tool.uv]
required-version = ">=0.11.23"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.package_name }}"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
